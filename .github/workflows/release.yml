name: Release

on:
  # Release once a day instead of on every push. Package-affecting changes
  # accumulate on master and the scheduled run ships them as one version.
  # 04:30 UTC = 07:30 Europe/Istanbul (after Dependabot's 06:00 run and the
  # top-of-the-hour scheduler rush).
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
          - prerelease

permissions:
  contents: write

# Serialize releases. A manual run and the scheduled run should not overlap.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Cheap check before installing/building. `scripts/release.sh` owns the
      # policy for what counts as a release-worthy change.
      - name: Check for release-worthy changes
        id: changes
        if: github.event_name == 'schedule' || inputs.release_type == 'auto'
        env:
          CHECK_ONLY: 'true'
        run: ./scripts/release.sh auto

      - name: Setup Node.js
        if: steps.changes.outputs.release != 'false'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configure Git
        if: steps.changes.outputs.release != 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # If another commit landed while this run was queued or starting, skip
      # instead of racing it. The next scheduled run will include it.
      - name: Check master has not moved
        id: head
        if: steps.changes.outputs.release != 'false'
        run: |
          set -euo pipefail

          # A manual, explicit bump is intentional; let it proceed.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.release_type }}" != "auto" ]; then
            echo "moved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          remote_sha=$(git ls-remote origin refs/heads/master | cut -f1)
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            echo "moved=true" >> "$GITHUB_OUTPUT"
            echo "::notice::master moved from $GITHUB_SHA to $remote_sha; the next scheduled run will handle it."
          else
            echo "moved=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.changes.outputs.release != 'false' && steps.head.outputs.moved != 'true'
        run: npm ci

      - name: Record HEAD before release
        id: before
        if: steps.changes.outputs.release != 'false' && steps.head.outputs.moved != 'true'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run release script
        if: steps.changes.outputs.release != 'false' && steps.head.outputs.moved != 'true'
        env:
          RELEASE_TYPE: ${{ inputs.release_type || 'auto' }}
        run: ./scripts/release.sh "$RELEASE_TYPE"

      - name: Detect created release
        id: release
        if: steps.changes.outputs.release != 'false' && steps.head.outputs.moved != 'true'
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" = "${{ steps.before.outputs.sha }}" ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "No release commit was created; nothing to push."
          else
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
          fi

      - name: Push changes and tags
        if: steps.release.outputs.created == 'true'
        run: git push --follow-tags origin "HEAD:${{ github.ref_name }}"

      - name: Create GitHub Release
        if: steps.release.outputs.created == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          # Changelog headings use the bare version, while tags are prefixed
          # with "v" by commit-and-tag-version.
          CHANGELOG_VERSION=${TAG_NAME#v}

          CHANGELOG_CONTENT=$(awk -v ver="$CHANGELOG_VERSION" '
            $0 ~ "## \\[?"ver {found=1; next}
            /^## \[?[0-9]/ && found {exit}
            found {print}
          ' CHANGELOG.md | sed '/^$/d')

          if [ -z "$CHANGELOG_CONTENT" ]; then
            CHANGELOG_CONTENT="Release $TAG_NAME"
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $TAG_NAME already exists; skipping."
            exit 0
          fi

          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --notes "$CHANGELOG_CONTENT" \
            --verify-tag
