name: Dependabot Auto Merge

# Runs after the CI workflow finishes for a Dependabot branch or for the
# security-audit automation branch. Filtering at the trigger level keeps this
# workflow from being created after every CI run on master; the job-level guard
# below is a second line of defence.
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - 'dependabot/**'
      - 'security/npm-audit-fix'
  # Sent by security-audit.yml after the dispatched CI run succeeds. A
  # `workflow_run` event does not fire for CI runs dispatched with GITHUB_TOKEN,
  # while repository_dispatch is exempt from that suppression.
  repository_dispatch:
    types:
      - security-audit-ci-complete

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge safe dependency PRs
    if: >
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        (
          github.event.workflow_run.event == 'pull_request' ||
          (github.event.workflow_run.event == 'workflow_dispatch' &&
           github.event.workflow_run.head_branch == 'security/npm-audit-fix')
        )
      ) ||
      (
        github.event_name == 'repository_dispatch' &&
        github.event.client_payload.branch == 'security/npm-audit-fix'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Resolve dependency pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.branch || github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          # Dependabot PRs keep their author filter. The audit branch is
          # resolved by exact head branch and its author is checked in the next
          # step, so a spoofed author is reported instead of silently ignored.
          # `gh` reports GitHub App authors as "app/<slug>" while the REST API
          # still says "<slug>[bot]", so both spellings are accepted.
          if [ "$HEAD_BRANCH" = "security/npm-audit-fix" ]; then
            jq_filter='.[0]'
          else
            jq_filter='[.[] | select(.author.login == "dependabot[bot]" or .author.login == "app/dependabot")][0]'
          fi

          pr_json=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$HEAD_BRANCH" \
            --state open \
            --json number,title,url,author,isCrossRepository,headRepository,headRefOid \
            --jq "$jq_filter")

          if [ -z "$pr_json" ] || [ "$pr_json" = "null" ]; then
            echo "No open dependency PR found for branch '$HEAD_BRANCH' - nothing to do."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "number=$(jq -r '.number' <<< "$pr_json")" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -r '.url' <<< "$pr_json")" >> "$GITHUB_OUTPUT"
          echo "title=$(jq -r '.title' <<< "$pr_json")" >> "$GITHUB_OUTPUT"
          echo "author=$(jq -r '.author.login' <<< "$pr_json")" >> "$GITHUB_OUTPUT"
          echo "cross_repository=$(jq -r '.isCrossRepository' <<< "$pr_json")" >> "$GITHUB_OUTPUT"
          echo "head_repository=$(jq -r '.headRepository.nameWithOwner // ""' <<< "$pr_json")" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(jq -r '.headRefOid' <<< "$pr_json")" >> "$GITHUB_OUTPUT"
          echo "Resolved PR #$(jq -r '.number' <<< "$pr_json"): $(jq -r '.title' <<< "$pr_json")"

      - name: Decide whether the update is safe to merge
        id: update
        if: steps.pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.branch || github.event.workflow_run.head_branch }}
          TITLE: ${{ steps.pr.outputs.title }}
          AUTHOR: ${{ steps.pr.outputs.author }}
          CROSS_REPOSITORY: ${{ steps.pr.outputs.cross_repository }}
          HEAD_REPOSITORY: ${{ steps.pr.outputs.head_repository }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          WORKFLOW_SHA: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sha || github.event.workflow_run.head_sha }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail

          if [ "$HEAD_BRANCH" = "security/npm-audit-fix" ]; then
            # The audit branch is produced by `npm audit fix` without
            # `--force`, so it cannot contain a forced major upgrade. Skip the
            # Dependabot title/version parser entirely and require the branch,
            # repository, author, and changed-file guards instead.
            if [ "$CROSS_REPOSITORY" != "false" ]; then
              echo "Audit PR comes from a fork ($CROSS_REPOSITORY) - leaving for manual review."
              echo "safe=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
              echo "Audit PR head repository '$HEAD_REPOSITORY' is not '$GITHUB_REPOSITORY' - leaving for manual review."
              echo "safe=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$AUTHOR" != "github-actions[bot]" ] && [ "$AUTHOR" != "app/github-actions" ]; then
              echo "Audit PR author '$AUTHOR' is not the automation identity - leaving for manual review."
              echo "safe=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$HEAD_SHA" != "$WORKFLOW_SHA" ]; then
              echo "Audit PR head moved from $WORKFLOW_SHA to $HEAD_SHA after CI started - leaving for manual review."
              echo "safe=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            files=$(gh pr view "$PR_URL" \
              --repo "$GITHUB_REPOSITORY" \
              --json files \
              --jq '.files[].path')
            if [ -z "$files" ]; then
              echo "Audit PR reports no changed files - leaving for manual review."
              echo "safe=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            unexpected=$(grep -vxE 'package(-lock)?\.json' <<< "$files" || true)
            if [ -n "$unexpected" ]; then
              echo "Audit PR changes files outside dependency manifests - leaving for manual review:"
              echo "$unexpected"
              echo "safe=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Audit PR passed branch, repository, author, and file-list guards - safe to merge."
            echo "safe=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Grouped minor/patch updates are safe by configuration: the groups
          # listed here can only contain minor and patch bumps (see
          # dependabot.yml). Any new group must be added explicitly.
          # Dependabot titles carry a "chore(deps): " scope prefix and use a
          # lowercase "bump", so match case-insensitively without anchoring.
          title_lc=$(tr '[:upper:]' '[:lower:]' <<< "$TITLE")
          if [[ "$title_lc" =~ bump\ the\ (minor-and-patch|github-actions)\ group ]]; then
            echo "Grouped minor/patch update detected - safe to merge."
            echo "safe=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          versions=$(sed -n 's/.* from v\{0,1\}\([0-9][^ ]*\) to v\{0,1\}\([0-9][^ ]*\).*/\1 \2/p' <<< "$TITLE")
          if [ -z "$versions" ]; then
            echo "Could not parse versions from title '$TITLE' - leaving for manual review."
            echo "safe=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          read -r current next <<< "$versions"
          current_major=${current%%.*}
          next_major=${next%%.*}

          if [ "$current_major" != "$next_major" ]; then
            echo "Major update ($current -> $next) - leaving for manual review."
            echo "safe=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # In the 0.x range a minor bump may be breaking, so only patches are
          # auto-merged there.
          if [ "$current_major" = "0" ]; then
            current_rest=${current#*.}
            next_rest=${next#*.}
            if [ "${current_rest%%.*}" != "${next_rest%%.*}" ]; then
              echo "0.x minor update ($current -> $next) - leaving for manual review."
              echo "safe=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "Non-major update ($current -> $next) - safe to merge."
          echo "safe=true" >> "$GITHUB_OUTPUT"

      - name: Merge pull request
        if: steps.update.outputs.safe == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail

          # Merge directly once CI has passed. If branch protection rules ask
          # for something extra (e.g. a review), fall back to enabling
          # auto-merge so the PR lands as soon as requirements are met.
          # The daily Release workflow picks the merge up automatically.
          gh pr merge "$PR_URL" --squash --delete-branch \
            || gh pr merge "$PR_URL" --auto --squash --delete-branch
