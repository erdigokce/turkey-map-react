name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }}, React ${{ matrix.react }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        react: ['18', '19']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Use React ${{ matrix.react }}
        run: >
          npm install --no-save --no-package-lock --no-audit --no-fund
          react@${{ matrix.react }} react-dom@${{ matrix.react }}

      - name: Run tests with coverage
        run: npm run test:coverage -- --ci

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  package:
    name: Build & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run clean-build

      - name: Test the built artifact
        run: npm run test:artifact -- --ci

      - name: Test the packed package
        run: npm run test:package

      - name: Test the published types
        run: npm run test:types

      - name: Pack publishable tarball
        run: |
          mkdir -p artifacts
          npm pack --ignore-scripts --pack-destination artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: artifacts/*.tgz
          if-no-files-found: error

  compat:
    name: React ${{ matrix.react }} compatibility
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ['16.8.6', '17.0.2', '18', '19']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: package
          path: artifacts

      - name: Run compatibility smoke test
        run: |
          TARBALL=$(find artifacts -name '*.tgz' -print -quit)
          TARBALL_PATH="$TARBALL" REACT_VERSION="${{ matrix.react }}" node scripts/test-compat.js
